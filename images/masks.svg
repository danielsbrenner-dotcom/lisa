<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Comedy and tragedy theatre masks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Comedy and tragedy masks</title>

  <!-- Shared mask outline -->
  <defs>
    <path id="mask" d="M-90 -96 C-58 -114 58 -114 90 -96 C102 -40 94 28 62 76 C40 106 20 120 0 120 C-20 120 -40 106 -62 76 C-94 28 -102 -40 -90 -96 Z"/>
  </defs>

  <!-- Tragedy mask (back, right, tilted right) -->
  <g transform="translate(278 138) rotate(15) scale(0.86)">
    <use href="#mask" fill="#ffffff" stroke="#7a1f2b" stroke-width="8" stroke-linejoin="round"/>
    <!-- sad brows: raised in the middle -->
    <path d="M-66 -46 C-52 -56 -34 -66 -16 -72" fill="none" stroke="#7a1f2b" stroke-width="7" stroke-linecap="round"/>
    <path d="M66 -46 C52 -56 34 -66 16 -72" fill="none" stroke="#7a1f2b" stroke-width="7" stroke-linecap="round"/>
    <!-- sad eyes: droop toward the outside -->
    <path d="M-62 -14 C-52 -36 -28 -44 -14 -36 C-22 -18 -44 -8 -62 -14 Z" fill="#7a1f2b"/>
    <path d="M62 -14 C52 -36 28 -44 14 -36 C22 -18 44 -8 62 -14 Z" fill="#7a1f2b"/>
    <!-- tear -->
    <path d="M-46 4 C-42 16 -38 22 -42 28 C-46 33 -53 29 -51 22 C-50 15 -48 10 -46 4 Z" fill="#7a1f2b"/>
    <!-- frowning mouth -->
    <path d="M-42 78 C-30 42 30 42 42 78 C24 66 -24 66 -42 78 Z" fill="#7a1f2b"/>
  </g>

  <!-- Comedy mask (front, left, tilted left) -->
  <g transform="translate(140 158) rotate(-14) scale(0.86)">
    <use href="#mask" fill="#7a1f2b" stroke="#5c1620" stroke-width="8" stroke-linejoin="round"/>
    <!-- happy brows: high arches -->
    <path d="M-64 -62 C-52 -80 -30 -82 -16 -68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M64 -62 C52 -80 30 -82 16 -68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <!-- smiling eyes: upward crescents -->
    <path d="M-62 -18 C-52 -42 -24 -42 -14 -18 C-26 -28 -50 -28 -62 -18 Z" fill="#ffffff"/>
    <path d="M62 -18 C52 -42 24 -42 14 -18 C26 -28 50 -28 62 -18 Z" fill="#ffffff"/>
    <!-- big smile -->
    <path d="M-54 28 C-30 42 30 42 54 28 C44 82 -44 82 -54 28 Z" fill="#ffffff"/>
    <!-- cheek lines -->
    <path d="M-72 14 C-68 24 -62 30 -56 32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 14 C68 24 62 30 56 32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
